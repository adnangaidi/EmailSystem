spring.application.name=EmailProject
spring.datasource.url=jdbc:sqlite:emailsystem.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=com.projects.adnan.EmailProject.config.SafeSQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# 3. CRUCIAL: Force Spring Boot to run data.sql for SQLite
spring.sql.init.mode=always

# 4. CRUCIAL: Wait for Hibernate to create tables before running data.sql
spring.jpa.defer-datasource-initialization=true

# AES-256 key for encryption (Base64 encoded 32 bytes)
app.crypto-key=${APP_CRYPTO_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
