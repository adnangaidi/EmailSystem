<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Sign in')}"></head>




<body class="auth-bg d-flex align-items-center justify-content-center p-3">

<div class="card auth-card">
    <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
            <span class="brand-mark brand-lg mb-3"><i class="bi bi-envelope-lock-fill"></i></span>
            <h1 class="h4 fw-bold mb-1">Welcome back</h1>
            <p class="text-body-secondary mb-0">Sign in to your secure mailbox</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger py-2" role="alert">
            <i class="bi bi-exclamation-triangle me-1"></i>Invalid credentials, or the account is locked or disabled.
        </div>
        <div th:if="${param.logout}" class="alert alert-info py-2" role="alert">
            <i class="bi bi-info-circle me-1"></i>You have been signed out.
        </div>
        <div th:if="${param.registered}" class="alert alert-success py-2" role="alert">
            <i class="bi bi-check-circle me-1"></i>Account created. You can sign in now.
        </div>

        <form th:action="@{/login}" method="post" novalidate>
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="username" name="username" placeholder="Username or email"
                       autocomplete="username" autofocus required>
                <label for="username">Username or email</label>
            </div>
            <div class="input-group mb-4">
                <div class="form-floating flex-grow-1">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Password"
                           autocomplete="current-password" required>
                    <label for="password">Password</label>
                </div>
                <button class="btn btn-outline-secondary" type="button" data-toggle-password="#password" title="Show / hide">
                    <i class="bi bi-eye"></i>
                </button>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">
                <i class="bi bi-box-arrow-in-right me-1"></i>Sign in
            </button>
        </form>

        <p class="text-center text-body-secondary mt-4 mb-0">
            No account yet? <a th:href="@{/register}" class="fw-semibold text-decoration-none">Create one</a>
        </p>
    </div>
</div>

<th:block th:replace="~{fragments/head :: scripts}"></th:block>
</body>
</html>
