<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Access denied')}"></head>
<body class="auth-bg d-flex align-items-center justify-content-center p-3">

<div class="card auth-card text-center">
    <div class="card-body p-4 p-md-5">
        <i class="bi bi-shield-lock fs-1 text-body-secondary"></i>
        <div class="error-code my-2">403</div>
        <h1 class="h4 fw-bold">Access denied</h1>
        <p class="text-body-secondary mb-4" th:text="${message != null} ? ${message} : 'You do not have permission to open this page.'">You do not have permission to open this page.</p>
        <a th:href="@{/inbox}" class="btn btn-primary"><i class="bi bi-house me-1"></i>Back to my mailbox</a>
    </div>
</div>

<th:block th:replace="~{fragments/head :: scripts}"></th:block>
</body>
</html>
