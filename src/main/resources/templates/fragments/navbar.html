<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- ============ top navbar ============ -->
<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg app-navbar border-bottom sticky-top">
    <div class="container-xl">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" th:href="@{/inbox}">
            <span class="brand-mark"><i class="bi bi-envelope-lock-fill"></i></span> SecureMail
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'mail'} ? 'active fw-semibold'" th:href="@{/inbox}">
                        <i class="bi bi-inbox me-1"></i>Mail
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:classappend="${active == 'admin'} ? 'active fw-semibold'" th:href="@{/admin/users}">
                        <i class="bi bi-shield-lock me-1"></i>Administration
                    </a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2">
                <button id="theme-toggle" type="button" class="btn btn-outline-secondary btn-sm" title="Toggle theme">
                    <i id="theme-icon" class="bi bi-moon-stars"></i>
                </button>
                <div class="dropdown">
                    <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle me-1"></i><span sec:authentication="name">user</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                        <li class="px-3 py-1 small text-body-secondary">
                            <span sec:authorize="hasRole('ADMIN')">Administrator</span>
                            <span sec:authorize="!hasRole('ADMIN')">User</span>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="dropdown-item"><i class="bi bi-box-arrow-right me-2"></i>Sign out</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- ============ flash messages ============ -->
<div th:fragment="flash">
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show d-flex align-items-center" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${message}">Done</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<!-- ============ mail sidebar ============ -->
<aside th:fragment="mailSidebar(active)" class="mail-sidebar">
    <a th:href="@{/compose}" class="btn btn-primary w-100 mb-3">
        <i class="bi bi-pencil-square me-2"></i>Compose
    </a>
    <div class="list-group">
        <a th:href="@{/inbox}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
           th:classappend="${active == 'inbox'} ? 'active'">
            <span><i class="bi bi-inbox me-2"></i>Inbox</span>
            <span th:if="${unread != null and unread > 0}" class="badge rounded-pill text-bg-danger" th:text="${unread}">3</span>
        </a>
        <a th:href="@{/sent}" class="list-group-item list-group-item-action" th:classappend="${active == 'sent'} ? 'active'">
            <i class="bi bi-send me-2"></i>Sent
        </a>
        <a th:href="@{/trash}" class="list-group-item list-group-item-action" th:classappend="${active == 'trash'} ? 'active'">
            <i class="bi bi-trash3 me-2"></i>Trash
        </a>
    </div>
</aside>

<!-- ============ pagination (Spring Data Page) ============ -->
<nav th:fragment="pager(page, url)" th:if="${page.totalPages > 1}" aria-label="Pagination">
    <ul class="pagination pagination-sm justify-content-center mb-0">
        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <a class="page-link" th:href="@{${url}(page=${page.number - 1})}" aria-label="Previous">&laquo;</a>
        </li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
            th:if="${i >= page.number - 2 and i <= page.number + 2}"
            th:classappend="${i == page.number} ? 'active'">
            <a class="page-link" th:href="@{${url}(page=${i})}" th:text="${i + 1}">1</a>
        </li>
        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link" th:href="@{${url}(page=${page.number + 1})}" aria-label="Next">&raquo;</a>
        </li>
    </ul>
</nav>

</body>
</html>
